services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - manifesto_data:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  manifesto_data:
  caddy_data:
  caddy_config:
