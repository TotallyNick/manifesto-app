services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - manifesto_data:/data
    expose:
      - "3000"

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN}
      PUBLIC_PORT: ${PUBLIC_PORT:-8443}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
    dns:
      - 1.1.1.1
      - 1.0.0.1
    ports:
      - "${PUBLIC_PORT:-8443}:${PUBLIC_PORT:-8443}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  manifesto_data:
  caddy_data:
  caddy_config:
